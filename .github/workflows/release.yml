name: release

# Ежедневная проверка источников; релиз — при изменении маршрутов или по ручному запуску.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      refresh_prefixes:
        description: "Обновить BGP-префиксы перед сборкой (DNS + Team Cymru + RIPEstat)"
        type: boolean
        default: true
      import_external:
        description: "Перепроверить внешние списки российских сетей"
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ru-direct-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check collector regressions
        run: |
          python3 tools/privacy_scan.py
          python3 -m unittest discover -s tools -p test_collectors.py -v

      # Внешние списки перепроверяются до обновления префиксов: импорт сверяется
      # с набором ASN из прошлого снапшота, а refresh уже подмешивает результат.
      - name: Import external sources
        if: github.event_name == 'schedule' || inputs.import_external
        run: python3 tools/import_external.py

      - name: Refresh BGP prefixes
        if: github.event_name == 'schedule' || inputs.refresh_prefixes
        run: python3 tools/refresh_prefixes.py

      # Amnezia не резолвит домены при импорте JSON: AmneziaWG и мобильные клиенты
      # берут маршруты только из полей ips/ip записи. Снапшот IP кладётся в сборку.
      - name: Resolve domain IPs
        if: github.event_name == 'schedule' || inputs.import_external
        run: python3 tools/resolve_domains.py

      - name: Build lists
        run: |
          python3 tools/catalog.py
          python3 tools/build_ru_direct.py
          python3 -m unittest discover -s tools -p test_collectors.py -v

      - name: Detect changed routing assets
        id: changes
        run: |
          if git diff --quiet -- dist/amnezia-ru-direct.json dist/amnezia-ru-direct-lite.json \
            dist/amnezia-ru-direct-ip.json dist/ru-direct-domains.txt dist/ru-direct-ipv4.txt \
            dist/wg-allowed-ips.txt dist/happ-ru-direct.json; then
            echo "routes=false" >> "$GITHUB_OUTPUT"
          else
            echo "routes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/prefixes.json data/external.json data/external-report.md data/external-candidates.json data/domain-ips.json dist
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "RU Direct: обновление списков $(date -u +%Y-%m-%d)" \
              -- data/prefixes.json data/external.json data/external-report.md data/external-candidates.json data/domain-ips.json dist
            git push
          fi

      - name: Publish release
        if: steps.changes.outputs.routes == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ru-direct-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          DAY="$(date -u +%d.%m.%Y)"
          # Сверху — инструкция для обычного пользователя, ниже — техническая сводка сборки.
          sed "s/{{DATE}}/${DAY}/" .github/release-header.md > "${RUNNER_TEMP}/notes.md"
          cat dist/RELEASE_NOTES.md >> "${RUNNER_TEMP}/notes.md"
          # Установщик в один клик: постоянная ссылка releases/latest/download/install-windows.bat.
          cp windows/install.bat "${RUNNER_TEMP}/install-windows.bat"
          gh release create "${TAG}" \
            --target "$(git rev-parse HEAD)" --latest \
            --title "Актуальный список российских сайтов для Amnezia VPN (${DAY})" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            dist/amnezia-ru-direct.json \
            dist/amnezia-ru-direct-lite.json \
            dist/amnezia-ru-direct-ip.json \
            dist/ru-direct-domains.txt \
            dist/ru-direct-ipv4.txt \
            dist/wg-allowed-ips.txt \
            dist/happ-ru-direct.json \
            dist/manifest.json \
            "${RUNNER_TEMP}/install-windows.bat"
          # В Releases держим одну актуальную сборку: старые только путают, история
          # остаётся в git (dist/), а /releases/latest/download/<файл> ведёт на свежую.
          gh release list --limit 200 --json tagName --jq '.[].tagName' |
            while read -r old; do
              [ "${old}" = "${TAG}" ] || gh release delete "${old}" --cleanup-tag --yes
            done

      - name: Record coverage summary
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          manifest = json.loads(pathlib.Path("dist/manifest.json").read_text())
          external = json.loads(pathlib.Path("data/external.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Domains: {manifest['domains']}; IPv4 routes: {manifest['cidrs']}; "
                            f"lite entries: {manifest['lite_entries']}\n\n")
              summary.write(f"Sources: {len(external['sources'])}; "
                            f"external subdomains: {external.get('domain_count', 0)}; "
                            f"external prefixes: {external['prefix_count']}\n")
          PY

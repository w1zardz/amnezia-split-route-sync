name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Static checks and unit tests
        run: |
          python3 tools/privacy_scan.py
          python3 -m py_compile macos/update_amnezia_routes.py tools/generate_routes.py tools/privacy_scan.py
          python3 -m unittest discover -s tests -v
          bash -n macos/install.sh macos/uninstall.sh
          python3 -m json.tool config/route-policy.json >/dev/null
          python3 -m json.tool config/custom-host-policy.example.json >/dev/null
      - name: Validate current upstream without writing
        run: |
          cp tests/fixtures/custom-host-policy.json config/custom-host-policy.json
          python3 tools/generate_routes.py --dry-run

  macos-helper:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile Swift helper and lint LaunchAgent
        run: |
          xcrun swiftc -warnings-as-errors -O macos/set-amnezia-routes.swift -o "${RUNNER_TEMP}/set-amnezia-routes"
          plutil -lint macos/io.github.amnezia-route-sync.plist.template

  windows-powershell:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Parse PowerShell 5.1 scripts
        shell: powershell
        run: |
          $scripts = @(
            '.\windows\install.ps1',
            '.\windows\uninstall.ps1',
            '.\windows\update-amnezia-routes.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { throw "$script parse failed: $($errors | Out-String)" }
          }
      - name: Run Windows codec and validation self-tests
        shell: powershell
        run: |
          Copy-Item .\config\route-policy.json .\windows\route-policy.json
          Copy-Item .\tests\fixtures\custom-host-policy.json .\windows\custom-host-policy.json
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\update-amnezia-routes.ps1 -CodecSelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\update-amnezia-routes.ps1 -ValidationSelfTest
      - name: Run the documented portable generator on Windows
        shell: powershell
        run: |
          py -3 .\tools\generate_routes.py --policy .\config\route-policy.json --config .\tests\fixtures\custom-host-policy.json --output "$env:RUNNER_TEMP\ip-list.json"
          Get-Content "$env:RUNNER_TEMP\ip-list.manifest.json" -Raw | ConvertFrom-Json | Out-Null
